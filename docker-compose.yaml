services:
  db:
    image: mysql:8.0
    container_name: rhythm-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: rhythm
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: rhythm-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/rhythm?connectionTimeZone=UTC&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: 1234
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: 3600000
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data: