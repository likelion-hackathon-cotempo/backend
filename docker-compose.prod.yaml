# EC2 배포용. 로컬 개발은 docker-compose.yaml을 사용한다.
#
# 로컬 파일과 다른 점
#  - build 대신 image: 서버에서 Gradle 빌드를 하지 않고 레지스트리에서 pull만 한다
#  - db의 ports 없음: MySQL을 외부에 노출하지 않는다 (앱은 도커 네트워크로 db:3306 접근)
#  - app을 127.0.0.1에만 바인딩: 외부 접근은 Nginx(443)만 통한다
#  - restart 정책: EC2 재부팅 시 컨테이너가 자동으로 복구된다
#
# 실행: docker compose -f docker-compose.prod.yaml up -d
# 주의: -v 옵션은 DB 볼륨까지 삭제한다. 서버에서는 절대 쓰지 말 것.

services:
  db:
    image: mysql:8.0
    container_name: rhythm-db
    # performance_schema는 수백 MB를 점유한다. 2GB 인스턴스에서는 끄는 편이 안전하다.
    command: --performance-schema=OFF
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: rhythm
      TZ: UTC
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${DOCKERHUB_USERNAME}/rhythm-app:${IMAGE_TAG:-latest}
    container_name: rhythm-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/rhythm?connectionTimeZone=UTC&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
