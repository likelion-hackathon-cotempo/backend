name: Image

# 배포용 이미지를 빌드해 Docker Hub에 올리고, 이어서 EC2에 자동 배포한다.
# EC2에서 Gradle 빌드를 돌리지 않기 위한 워크플로다.
#  - main 머지 시 자동 실행
#  - Actions 탭에서 수동 실행(workflow_dispatch)도 가능
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# 연속 머지 시 이전 빌드를 취소해 Docker Hub 태그 경합을 막는다.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: rhythm-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: 짧은 커밋 해시 추출
        id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 이미지 빌드 및 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # EC2가 x86_64이므로 명시적으로 고정한다.
          # 맥(Apple Silicon)에서 빌드하면 arm64가 나와 서버에서 exec format error가 난다.
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          # Gradle 의존성 레이어를 재사용해 빌드 시간을 줄인다.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 배포 태그 출력
        run: |
          echo "### 이미지 푸시 완료" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: EC2에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # 한 스텝이라도 실패하면 즉시 중단하고 실패로 처리한다.
          script_stop: true
          script: |
            cd "${{ secrets.EC2_APP_DIR }}"

            # docker-compose.prod.yaml 같은 배포 설정 자체가 바뀌는 경우도 있으므로
            # 이미지뿐 아니라 레포 상태도 항상 origin/main에 맞춘다.
            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.prod.yaml up -d

            for i in $(seq 1 30); do
              if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo "정상 기동 확인"
                exit 0
              fi
              sleep 2
            done

            echo "헬스체크 실패: /actuator/health가 60초 내에 UP이 되지 않았습니다"
            docker compose -f docker-compose.prod.yaml logs --tail=100 app
            exit 1
